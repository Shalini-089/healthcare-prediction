<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-4">
    <a href="/" class="navbar-brand">Healthcare Disease Prediction</a>
</nav>

<div class="container mt-5">

    <h2 class="text-center mb-4">Diabetes Risk Prediction</h2>

    <div class="row">

        <!-- LEFT SIDE FORM -->
        <div class="col-md-6">
            <div class="card shadow p-4">
                <h4 class="mb-3">Patient Details</h4>

                <form action="/predict" method="post">

                    <input type="number" step="any" name="Pregnancies" class="form-control mb-3" placeholder="Pregnancies" required>
                    <input type="number" step="any" name="Glucose" class="form-control mb-3" placeholder="Glucose" required>
                    <input type="number" step="any" name="BloodPressure" class="form-control mb-3" placeholder="Blood Pressure" required>
                    <input type="number" step="any" name="SkinThickness" class="form-control mb-3" placeholder="Skin Thickness" required>
                    <input type="number" step="any" name="Insulin" class="form-control mb-3" placeholder="Insulin" required>
                    <input type="number" step="any" name="BMI" class="form-control mb-3" placeholder="BMI" required>
                    <input type="number" step="any" name="DiabetesPedigreeFunction" class="form-control mb-3" placeholder="Diabetes Pedigree Function" required>
                    <input type="number" step="any" name="Age" class="form-control mb-3" placeholder="Age" required>

                    <button type="submit" class="btn btn-primary w-100">Predict Now</button>

                </form>
            </div>
        </div>

        <!-- RIGHT SIDE RESULT -->
        <div class="col-md-6">
            <div class="card shadow p-4 text-center">

                <h4>Prediction Result</h4>

                {% if prediction %}
                    <h2 class="text-{{color}} mt-3">{{ prediction }}</h2>
                    <h5>{{ risk }}</h5>

                    <p class="mt-3"><strong>{{ confidence }}%</strong> Confidence</p>

                    <div class="progress">
                        <div class="progress-bar bg-{{color}}" 
                             style="width: {{ confidence }}%">
                        </div>
                    </div>

                    <div class="alert alert-info mt-4">
                        Maintain healthy diet & regular exercise.
                    </div>

                    <a href="/" class="btn btn-outline-primary mt-3">Back</a>
                {% else %}
                    <p class="text-muted mt-3">Enter details and click Predict.</p>
                {% endif %}

            </div>
        </div>

    </div>
</div>

</body>
</html>
