<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkinson's Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-4">
    <a href="/" class="navbar-brand">Healthcare Disease Prediction</a>
</nav>

<div class="container mt-5">

    <h2 class="text-center mb-4">Parkinson's Disease Prediction</h2>

    <div class="row">

        <!-- LEFT SIDE FORM -->
        <div class="col-md-6">
            <div class="card shadow p-4">
                <h4 class="mb-3">Patient Voice Details</h4>

                <form action="/parkinsons_predict" method="post">

                    <input type="number" step="any" name="MDVP:Fo(Hz)" class="form-control mb-3" placeholder="MDVP:Fo(Hz)" required>
                    <input type="number" step="any" name="MDVP:Fhi(Hz)" class="form-control mb-3" placeholder="MDVP:Fhi(Hz)" required>
                    <input type="number" step="any" name="MDVP:Flo(Hz)" class="form-control mb-3" placeholder="MDVP:Flo(Hz)" required>
                    <input type="number" step="any" name="MDVP:Jitter(%)" class="form-control mb-3" placeholder="MDVP:Jitter(%)" required>
                    <input type="number" step="any" name="MDVP:Jitter(Abs)" class="form-control mb-3" placeholder="MDVP:Jitter(Abs)" required>
                    <input type="number" step="any" name="MDVP:RAP" class="form-control mb-3" placeholder="MDVP:RAP" required>
                    <input type="number" step="any" name="MDVP:PPQ" class="form-control mb-3" placeholder="MDVP:PPQ" required>
                    <input type="number" step="any" name="Jitter:DDP" class="form-control mb-3" placeholder="Jitter:DDP" required>
                    <input type="number" step="any" name="MDVP:Shimmer" class="form-control mb-3" placeholder="MDVP:Shimmer" required>
                    <input type="number" step="any" name="MDVP:Shimmer(dB)" class="form-control mb-3" placeholder="MDVP:Shimmer(dB)" required>
                    <input type="number" step="any" name="Shimmer:APQ3" class="form-control mb-3" placeholder="Shimmer:APQ3" required>
                    <input type="number" step="any" name="Shimmer:APQ5" class="form-control mb-3" placeholder="Shimmer:APQ5" required>
                    <input type="number" step="any" name="MDVP:APQ" class="form-control mb-3" placeholder="MDVP:APQ" required>
                    <input type="number" step="any" name="Shimmer:DDA" class="form-control mb-3" placeholder="Shimmer:DDA" required>
                    <input type="number" step="any" name="NHR" class="form-control mb-3" placeholder="NHR" required>
                    <input type="number" step="any" name="HNR" class="form-control mb-3" placeholder="HNR" required>
                    <input type="number" step="any" name="RPDE" class="form-control mb-3" placeholder="RPDE" required>
                    <input type="number" step="any" name="DFA" class="form-control mb-3" placeholder="DFA" required>
                    <input type="number" step="any" name="spread1" class="form-control mb-3" placeholder="spread1" required>
                    <input type="number" step="any" name="spread2" class="form-control mb-3" placeholder="spread2" required>
                    <input type="number" step="any" name="D2" class="form-control mb-3" placeholder="D2" required>
                    <input type="number" step="any" name="PPE" class="form-control mb-3" placeholder="PPE" required>

                    <button type="submit" class="btn btn-primary w-100">Predict Now</button>

                </form>
            </div>
        </div>

        <!-- RIGHT SIDE RESULT -->
        <div class="col-md-6">
            <div class="card shadow p-4 text-center">

                <h4>Prediction Result</h4>

                {% if prediction %}
                    <h2 class="text-danger mt-3">{{ prediction }}</h2>

                    <div class="alert alert-info mt-4">
                        Please consult a neurologist for proper diagnosis.
                    </div>

                    <a href="/" class="btn btn-outline-primary mt-3">Back</a>

                {% else %}
                    <p class="text-muted mt-3">Enter details and click Predict.</p>
                {% endif %}

            </div>
        </div>
