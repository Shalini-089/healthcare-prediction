<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-4">
    <a href="/" class="navbar-brand">Healthcare Disease Prediction</a>
</nav>

<div class="container mt-5">

    <h2 class="text-center mb-4">Heart Disease Risk Prediction</h2>

    <div class="row">

        <!-- LEFT SIDE FORM -->
        <div class="col-md-6">
            <div class="card shadow p-4">
                <h4 class="mb-3">Patient Details</h4>

                <form action="/heart_predict" method="post">

                    <input type="number" step="any" name="age" class="form-control mb-3" placeholder="Age" required>
                    <input type="number" step="any" name="sex" class="form-control mb-3" placeholder="Sex (1 = Male, 0 = Female)" required>
                    <input type="number" step="any" name="cp" class="form-control mb-3" placeholder="Chest Pain Type (0-3)" required>
                    <input type="number" step="any" name="trestbps" class="form-control mb-3" placeholder="Resting Blood Pressure" required>
                    <input type="number" step="any" name="chol" class="form-control mb-3" placeholder="Cholesterol" required>
                    <input type="number" step="any" name="fbs" class="form-control mb-3" placeholder="Fasting Blood Sugar (0 or 1)" required>
                    <input type="number" step="any" name="restecg" class="form-control mb-3" placeholder="Resting ECG (0-2)" required>
                    <input type="number" step="any" name="thalach" class="form-control mb-3" placeholder="Maximum Heart Rate Achieved" required>
                    <input type="number" step="any" name="exang" class="form-control mb-3" placeholder="Exercise Induced Angina (0 or 1)" required>
                    <input type="number" step="any" name="oldpeak" class="form-control mb-3" placeholder="Oldpeak (ST depression)" required>
                    <input type="number" step="any" name="slope" class="form-control mb-3" placeholder="ST Slope (0-2)" required>

                    <button type="submit" class="btn btn-primary w-100">Predict Now</button>

                </form>
            </div>
        </div>

        <!-- RIGHT SIDE RESULT -->
        <div class="col-md-6">
            <div class="card shadow p-4 text-center">

                <h4>Prediction Result</h4>

                {% if prediction %}
                    <h2 class="text-danger mt-3">{{ prediction }}</h2>

                    <div class="alert alert-info mt-4">
                        Maintain a healthy lifestyle and consult a doctor if needed.
                    </div>

                    <a href="/" class="btn btn-outline-primary mt-3">Back</a>
                {% else %}
                    <p class="text-muted mt-3">Enter details and click Predict.</p>
                {% endif %}

            </div>
        </div>

    </div>
</div>

</body>
</html>
